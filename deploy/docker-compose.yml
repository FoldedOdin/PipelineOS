# Run from repo root: docker compose -f deploy/docker-compose.yml --project-directory . up --build
# (Makefile sets --project-directory so paths below resolve to the repository root.)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3001:3001"
    env_file: ./deploy/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app:z
      - /app/node_modules
      - pipeline_data:/data

  runner:
    restart: unless-stopped
    build:
      context: .
      dockerfile: runner/Dockerfile
    env_file: ./deploy/.env
    depends_on:
      - api
    environment:
      - SSH_AUTH_SOCK=/run/user/1000/ssh-agent.socket
    security_opt:
      - label:disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/pipelineos-workspaces:/tmp/pipelineos-workspaces:z
      - ./runner:/app:z
      - /app/node_modules
      - /run/user/1000/ssh-agent.socket:/run/user/1000/ssh-agent.socket:z

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3002:3000"
    env_file: ./deploy/.env
    depends_on:
      - api
    volumes:
      - ./frontend:/app:z
      - /app/node_modules

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  mongo_data:
  pipeline_data:
